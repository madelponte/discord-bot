name: Build and publish container

# Build the bot image and push it to the GitHub Container Registry (GHCR)
# whenever new code lands on main. Pull requests that target main are also
# built (and pushed, tagged pr-<number>) so changes can be tested before
# merge. Also runnable manually from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Avoid redundant builds: a new push to a branch/PR cancels its in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Build pushes to main and same-repo pull requests only. PRs opened from a
    # fork run with a read-only token and no package write access, so building
    # them would just fail — skip them rather than auto-build untrusted code.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write   # required to push to GHCR with GITHUB_TOKEN

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # On push to main: tag `latest` + `sha-<commit>`.
          # On a pull request: tag `pr-<number>` only (never moves `latest`).
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,enable=${{ github.event_name != 'pull_request' }}
            type=ref,event=pr

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
